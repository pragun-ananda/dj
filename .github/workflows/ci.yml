name: CI & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit, E2E Tests & Coverage
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Audio Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          uv pip install --system -e ".[dev]" pytest-cov soundfile scipy librosa

      - name: Run Test Suite with Strict Coverage Check (>=90%)
        run: |
          pytest --cov=sonicdj --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Run Ground-Truth Benchmarks
        run: |
          python experiments/benchmark_against_ground_truth.py

      - name: Run Milestone 1 E2E Verification Experiment
        run: |
          python experiments/verify_milestone_1.py
